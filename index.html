<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Locker | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --wood: #4e321e;
      --cream: #fff7e6;
      --sand: #ddcdbd;
      --purple: #8737db;
      --ink: #3c2e1d
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: "Prompt", sans-serif;
      background: #f6eedb;
      color: var(--ink)
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .04) 0 8px, rgba(0, 0, 0, .05) 8px 14px), var(--wood)
    }

    .login {
      position: relative;
      width: min(100%, 430px);
      padding: 35px 28px 30px;
      background: var(--cream);
      border: 2px solid var(--purple);
      border-radius: 25px;
      box-shadow: 0 16px 35px #1e100980
    }

        .seal {
            position: absolute;
      left: 50%;
      top: -48px;
      translate: -50%;
      width: 82px;
      height: 82px;
      border-radius: 50%;
            display: grid;
            place-items: center;
      text-align: center;
      line-height: 1.05;
      color: #fff3d1;
      background: #b6382a;
      border: 5px double #f5ca75;
      font-family: "Prompt", sans-serif;
      font-size: 15px;
      margin: 14px 0 6px
    }

    .login input {
      width: 100%;
      border: 0;
      border-radius: 99px;
      background: var(--sand);
      padding: 13px 16px;
      font: inherit;
      color: var(--ink);
      outline: 2px solid transparent
    }

    .login input:focus {
      outline-color: #b67be8
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      margin: 12px 1px 20px
    }

    .options label {
      margin: 0;
      font-family: inherit;
      font-size: 10px
    }

    .options a {
      color: var(--wood);
      text-decoration: none
    }

    .field-group {
      position: relative;
      margin-bottom: 12px;
    }

    .field-group .field-with-icon {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle-password {
      border: 1px solid rgba(135, 55, 219, .35);
      background: #fff;
      color: var(--purple);
      font: 500 12px "Prompt", sans-serif;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 999px;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .toggle-password:hover {
      background: #f8f2ff;
      transform: translateY(-1px);
    }

    .submit {
      width: 100%;
      border: 0;
      border-radius: 99px;
      background: #3c301c;
      color: #fff8e9;
      padding: 12px;
      font: 600 19px "Prompt", sans-serif;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(60, 48, 28, .18);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .submit:hover {
      background: #624b2d;
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(60, 48, 28, .22);
    }

    .note {
      font-size: 10px;
      text-align: center;
      color: #816e58;
      margin: 16px 0 0
    }

    .error {
      display: none;
      margin: 12px 0 -2px;
      padding: 9px 11px;
      border-radius: 8px;
      background: #ffe1dd;
      color: #9a3026;
      font-size: 11px
    }

    .error.show {
      display: block
    }

    .help {
      position: fixed;
      right: 23px;
      top: 22px;
      width: 39px;
      height: 39px;
      border-radius: 50%;
      border: 0;
      color: white;
      background: #ad8b63;
      font: 700 27px "Prompt", sans-serif;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 22px rgba(0,0,0,.15);
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .help:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(0,0,0,.18);
      background: #c0915d;
    }

    @media(max-width:450px) {
      .login {
        padding: 31px 23px 25px
      }

      .page {
        padding: 16px
      }

      .seal {
        width: 74px;
        height: 74px;
        top: -43px
      }

      .login h1 {
        margin-top: 18px
      }
    }

    .signup {
      display: flex;
      justify-content: center;
      gap: 10px;
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #685642;
      font-family: "Prompt", sans-serif;
      font-weight: 500;
    }

    .signup a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid rgba(78, 50, 30, .15);
      color: var(--wood);
      font: 700 12px "Prompt", sans-serif;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .signup a:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(0,0,0,.12);
      background: #f7f2ea;
    }
  </style>
</head>

<body>
  <main class="page"><button class="help" title="ติดต่อผู้ดูแล">?</button>
    <form class="login" id="loginForm">
      <div class="seal"><img src="/assets/logo.svg" alt="Smart Locker logo"></div>
      <h1>Login</h1>
      <label for="identifier">Username หรือ Email</label>
      <input id="identifier" type="text" autocomplete="username" required>
      <div class="field-group">
        <label for="password">Password</label>
        <div class="field-with-icon">
          <input id="password" type="password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" data-target="password">แสดง</button>
        </div>
      </div>
      <div class="options"><label><input type="checkbox"> Remember me</label><a href="/forgot-password.html">Forgot password?</a></div>
      <button class="submit" type="submit">Login</button>
      <p class="error" id="error"></p>
      <p class="signup">ยังไม่มีบัญชี? <a href="/register.html">Sign up for a new account</a></p>
    </form>
  </main>
  <script>
    const form = document.querySelector('#loginForm');
    const error = document.querySelector('#error');
    const identifierInput = document.getElementById('identifier');
    const passwordInput = document.getElementById('password');
    const toggleButtons = document.querySelectorAll('.toggle-password');

    toggleButtons.forEach((button) => {
      const targetId = button.dataset.target;
      const targetInput = document.getElementById(targetId);
      button.addEventListener('click', () => {
        const isPassword = targetInput.type === 'password';
        targetInput.type = isPassword ? 'text' : 'password';
        button.textContent = isPassword ? 'ซ่อน' : 'แสดง';
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.classList.remove('show');
      const button = form.querySelector('button[type=submit]');
      button.textContent = 'กำลังเข้าสู่ระบบ...';
      button.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: identifierInput.value.trim(), password: passwordInput.value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        localStorage.setItem('lockerToken', data.token);
        location.href = data.next === 'rfid' ? '/rfid-enroll.html' : '/dashboard.html';
      } catch (err) {
        error.textContent = err.message || 'เข้าสู่ระบบไม่สำเร็จ';
        error.classList.add('show');
      } finally {
        button.textContent = 'Login';
        button.disabled = false;
      }
    });
  </script>
</body>

</html>
