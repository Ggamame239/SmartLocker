<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ตั้งค่ารหัสผ่านใหม่ | Smart Locker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood: #4e321e;
      --cream: #fff7e6;
      --sand: #ddcdbd;
      --purple: #8737db;
      --ink: #3c2e1d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Prompt", sans-serif;
      background: #f6eedb;
      color: var(--ink);
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .04) 0 8px, rgba(0, 0, 0, .05) 8px 14px), var(--wood);
    }

    .card {
      position: relative;
      width: min(100%, 430px);
      padding: 34px 28px 30px;
      background: var(--cream);
      border: 2px solid var(--purple);
      border-radius: 25px;
      box-shadow: 0 16px 35px #1e100980;
    }

    .seal {
      position: absolute;
      left: 50%;
      top: -44px;
      translate: -50%;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff3d1;
      background: #b6382a;
      border: 5px double #f5ca75;
      font-weight: 700;
      font-size: 17px;
    }

    .card h1 {
      text-align: center;
      font-size: 30px;
      margin: 15px 0 17px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 12px 0 6px;
    }

    input {
      width: 100%;
      border: 0;
      border-radius: 99px;
      background: var(--sand);
      padding: 12px 15px;
      font: 500 15px "Prompt", sans-serif;
      color: var(--ink);
      outline: 2px solid transparent;
    }

    input:focus {
      outline-color: #b67be8;
    }

    input {
      margin-bottom: 18px;
    }

    .submit {
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 99px;
      background: #3c301c;
      color: #fff8e9;
      padding: 14px 0;
      font: 700 17px "Prompt", sans-serif;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(60, 48, 28, .18);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .submit:hover {
      background: #2f2516;
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(60, 48, 28, .22);
    }

    .message {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 16px;
      background: #fff4f0;
      color: #87342f;
      font-size: 13px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 26px;
      width: 100%;
      padding: 12px 0;
      border-radius: 99px;
      background: #fff;
      color: var(--wood);
      border: 1px solid rgba(78, 50, 30, .18);
      text-decoration: none;
      font: 700 13px "Prompt", sans-serif;
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .link:hover {
      background: #f7f2ea;
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(0,0,0,.12);
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="seal">✔</div>
      <h1>ตั้งรหัสผ่านใหม่</h1>
      <label for="password">รหัสผ่านใหม่</label>
      <input id="password" type="password" minlength="6" required>
      <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
      <input id="confirmPassword" type="password" minlength="6" required>
      <button class="submit" id="submit">เปลี่ยนรหัสผ่าน</button>
      <div class="message" id="message"></div>
      <a href="/" class="link">กลับไปหน้าเข้าสู่ระบบ</a>
    </section>
  </main>
  <script>
    // รับ requestId จาก query string ที่ส่งมาจากหน้าก่อนหน้า
    const params = new URLSearchParams(window.location.search);
    const requestId = params.get('requestId');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const submitButton = document.getElementById('submit');
    const messageBox = document.getElementById('message');

    if (!requestId) {
      location.href = '/forgot-password.html';
    }

    submitButton.addEventListener('click', async () => {
      // ล้างข้อความแจ้งเตือนเดิมก่อน
      messageBox.classList.remove('show');
      const password = passwordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();
      if (!password || password.length < 6) {
        messageBox.textContent = 'กรุณากรอกรหัสผ่านใหม่อย่างน้อย 6 ตัวอักษร';
        messageBox.classList.add('show');
        return;
      }
      if (password !== confirmPassword) {
        messageBox.textContent = 'รหัสผ่านไม่ตรงกัน';
        messageBox.classList.add('show');
        return;
      }

      // ป้องกันการส่งซ้ำ
      submitButton.disabled = true;
      submitButton.textContent = 'กำลังเปลี่ยน...';
      try {
        const response = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requestId, password }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'เกิดข้อผิดพลาด');

        messageBox.textContent = data.message;
        messageBox.classList.add('show');
        submitButton.textContent = 'เปลี่ยนรหัสผ่าน';
        // ปิดปุ่มเมื่อเสร็จแล้วและกลับไปหน้า login อัตโนมัติ
        submitButton.disabled = true;
        setTimeout(() => location.href = '/', 1400);
      } catch (error) {
        messageBox.textContent = error.message;
        messageBox.classList.add('show');
      } finally {
        if (!submitButton.disabled) {
          submitButton.disabled = false;
          submitButton.textContent = 'เปลี่ยนรหัสผ่าน';
        }
      }
    });
  </script>
</body>

</html>
