<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Smart Locker | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --wood: #4e321e;
            --cream: #fff7e6;
            --sand: #ddcdbd;
            --purple: #8737db;
            --ink: #3c2e1d
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: "Noto Sans Thai", sans-serif;
            background: #f6eedb;
            color: var(--ink)
        }

        .page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 54px 18px 20px;
            background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .04) 0 8px, rgba(0, 0, 0, .05) 8px 14px), var(--wood)
        }

        .card {
            position: relative;
            width: min(100%, 430px);
            padding: 33px 28px 27px;
            background: var(--cream);
            border: 2px solid var(--purple);
            border-radius: 25px;
            box-shadow: 0 16px 35px #1e100980
        }

        .seal {
            position: absolute;
            left: 50%;
            top: -44px;
            translate: -50%;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            text-align: center;
            line-height: 1.05;
            color: #fff3d1;
            background: #b6382a;
            border: 5px double #f5ca75;
            font-family: "DM Serif Display", serif;
            font-size: 17px
        }

        .seal img { width: 100%; height: 100%; display: block; object-fit: contain }

        .card h1 {
            font-family: "DM Serif Display", serif;
            text-align: center;
            font-size: 30px;
            margin: 15px 0 17px
        }

        .card label {
            display: block;
            font-family: "DM Serif Display", serif;
            font-size: 14px;
            margin: 10px 0 4px
        }

        .card input {
            width: 100%;
            border: 0;
            border-radius: 99px;
            background: var(--sand);
            padding: 11px 15px;
            font: inherit;
            color: var(--ink);
            outline: 2px solid transparent
        }

        .card input:focus {
            outline-color: #b67be8
        }

        .submit {
            width: 100%;
            margin-top: 20px;
            border: 0;
            border-radius: 99px;
            background: #3c301c;
            color: #fff8e9;
            padding: 11px;
            font: 600 18px "DM Serif Display", serif;
            cursor: pointer
        }

        .submit:disabled {
            opacity: .7
        }

        .error {
            display: none;
            margin: 12px 0 -3px;
            padding: 9px 11px;
            border-radius: 8px;
            background: #ffe1dd;
            color: #9a3026;
            font-size: 11px
        }

        .error.show {
            display: block
        }

        .back {
            text-align: center;
            font-size: 12px;
            margin: 17px 0 0;
            color: #685642
        }

        .back a {
            font-weight: 700;
            color: var(--wood)
        }
    </style>
</head>

<body>
    <main class="page">
        <form class="card" id="registerForm">
            <div class="seal"><img src="/assets/logo.svg" alt="Smart Locker logo"></div>
            <h1>Register</h1><label for="username">Username</label><input id="username" minlength="3" maxlength="30"
                autocomplete="username" required><label for="email">Email</label><input id="email" type="email"
                autocomplete="email" required><label for="password">Password</label><input id="password" type="password"
                minlength="6" autocomplete="new-password" required><label for="confirmPassword">Confirm
                Password</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password"
                required><button class="submit" type="submit">Create Account</button>
            <p class="error" id="error"></p>
            <p class="back">มีบัญชีอยู่แล้ว? <a href="/">Back to Login</a></p>
        </form>
    </main>
    <script>
        const form = document.querySelector('#registerForm'), error = document.querySelector('#error'); form.addEventListener('submit', async (e) => { e.preventDefault(); error.classList.remove('show'); if (password.value !== confirmPassword.value) { error.textContent = 'Password และ Confirm Password ไม่ตรงกัน'; error.classList.add('show'); return } const b = form.querySelector('button'); b.disabled = true; b.textContent = 'กำลังสร้างบัญชี...'; try { const r = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username.value.trim(), email: email.value.trim(), password: password.value }) }); const d = await r.json(); if (!r.ok) throw new Error(d.message); localStorage.setItem('lockerToken', d.token); location.href = '/rfid-enroll.html' } catch (e) { error.textContent = e.message || 'สร้างบัญชีไม่สำเร็จ'; error.classList.add('show') } finally { b.disabled = false; b.textContent = 'Create Account' } });
    </script>
</body>

</html>
