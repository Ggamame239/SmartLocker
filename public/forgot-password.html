<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ลืมรหัสผ่าน | Smart Locker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood: #4e321e;
      --cream: #fff7e6;
      --sand: #ddcdbd;
      --purple: #8737db;
      --ink: #3c2e1d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Prompt", sans-serif;
      background: #f6eedb;
      color: var(--ink);
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .04) 0 8px, rgba(0, 0, 0, .05) 8px 14px), var(--wood);
    }

    .card {
      position: relative;
      width: min(100%, 430px);
      padding: 34px 28px 30px;
      background: var(--cream);
      border: 2px solid var(--purple);
      border-radius: 25px;
      box-shadow: 0 16px 35px #1e100980;
    }

    .seal {
      position: absolute;
      left: 50%;
      top: -44px;
      translate: -50%;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff3d1;
      background: #b6382a;
      border: 5px double #f5ca75;
      font-weight: 700;
      font-size: 17px;
    }

    .card h1 {
      text-align: center;
      font-size: 30px;
      margin: 15px 0 17px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 12px 0 6px;
    }

    input {
      width: 100%;
      border: 0;
      border-radius: 99px;
      background: var(--sand);
      padding: 12px 15px;
      font: 500 15px "Prompt", sans-serif;
      color: var(--ink);
      outline: 2px solid transparent;
    }

    input:focus {
      outline-color: #b67be8;
    }

    input {
      margin-bottom: 22px;
    }

    .submit {
      width: 100%;
      border: 0;
      border-radius: 99px;
      background: #3c301c;
      color: #fff8e9;
      padding: 14px 0;
      margin-top: 16px;
      font: 700 17px "Prompt", sans-serif;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(60, 48, 28, .18);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .submit:hover {
      background: #2f2516;
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(60, 48, 28, .22);
    }

    .helper {
      margin-top: 18px;
      font-size: 13px;
      color: #5f4c3e;
      line-height: 1.6;
    }

    .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      width: 100%;
      padding: 12px 0;
      border-radius: 999px;
      background: #fff;
      color: var(--wood);
      border: 1px solid rgba(78, 50, 30, .18);
      text-decoration: none;
      font: 700 13px "Prompt", sans-serif;
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .link:hover {
      background: #f7f2ea;
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(0,0,0,.12);
    }

    .message {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 16px;
      background: #fff4f0;
      color: #87342f;
      font-size: 13px;
      display: none;
    }

    .message.show {
      display: block;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="seal">?</div>
      <h1>ลืมรหัสผ่าน</h1>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <button class="submit" id="submit">ต่อไป</button>
      <p class="helper">กรอกอีเมลที่ผูกกับบัญชีของคุณ แล้วแตะบัตรที่ตู้ภายใน 60 วินาที</p>
      <div class="message" id="message"></div>
      <a href="/" class="link">กลับไปหน้าเข้าสู่ระบบ</a>
    </section>
  </main>
  <script>
    // ดึง element จาก DOM เพื่อใช้งาน
    const emailInput = document.getElementById('email');
    const submitButton = document.getElementById('submit');
    const messageBox = document.getElementById('message');

    // เมื่อผู้ใช้กดปุ่ม ขอรีเซ็ตรหัสผ่าน
    submitButton.addEventListener('click', async () => {
      // ซ่อนข้อความแจ้งเตือนเดิม
      messageBox.classList.remove('show');
      const email = emailInput.value.trim();
      if (!email) {
        messageBox.textContent = 'กรุณากรอกอีเมล';
        messageBox.classList.add('show');
        return;
      }

      // ป้องกันผู้ใช้กดซ้ำขณะร้องขอ
      submitButton.disabled = true;
      submitButton.textContent = 'กำลังดำเนินการ...';
      try {
        const response = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'เกิดข้อผิดพลาด');

        // ถ้า email นี้ไม่ต้องใช้ RFID ให้ไปหน้าตั้งรหัสผ่านใหม่ทันที
        if (data.skipRfid) {
          location.href = `/reset-password.html?requestId=${encodeURIComponent(data.requestId)}`;
        } else {
          // ถ้าต้องใช้ RFID ให้ไปหน้ารอการแตะบัตร
          location.href = `/forgot-password-wait.html?requestId=${encodeURIComponent(data.requestId)}`;
        }
      } catch (error) {
        messageBox.textContent = error.message;
        messageBox.classList.add('show');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'ต่อไป';
      }
    });
  </script>
</body>

</html>
