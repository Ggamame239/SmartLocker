<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ยืนยันบัตร RFID | Smart Locker</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: "Prompt", sans-serif;
      color: #3c2e1c
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: repeating-linear-gradient(90deg, #4c301c 0 9px, #573820 9px 15px)
    }

    .card {
      width: min(100%, 450px);
      text-align: center;
      padding: 43px 29px 30px;
      border: 2px solid #8737db;
      border-radius: 26px;
      background: #fff7e6;
      box-shadow: 0 17px 38px #1d100a9c
    }

    .icon {
      width: 83px;
      height: 83px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #f0dfbd;
      color: #79511e;
      font-size: 42px
    }

    .card h1 {
      font-family: "Prompt", sans-serif;
      font-weight: 700;
      font-size: 32px;
      margin: 0 0 9px
    }

    .card p {
      font-size: 14px;
      line-height: 1.7;
      margin: 0;
      color: #6f5d48
    }

    .waiting {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 22px;
      color: #2a714b;
      font-size: 12px;
      font-weight: 700
    }

    .pulse {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #32a66c;
      box-shadow: 0 0 0 0 #32a66c88;
      animation: pulse 1.4s infinite
    }

    .timer {
      margin-top: 16px;
      font-size: 14px;
      color: #4a3a25;
    }

    .timer strong {
      display: inline-block;
      min-width: 32px;
      text-align: center;
      font-size: 22px;
      color: #2d5f3f;
      transition: transform 0.18s ease;
    }

    .timer strong.tick {
      transform: scale(1.1);
    }

    @keyframes pulse {
      70% {
        box-shadow: 0 0 0 9px transparent
      }

      100% {
        box-shadow: 0 0 0 0 transparent
      }
    }

    button {
      margin-top: 25px;
      border: 0;
      border-radius: 999px;
      background: #3c301c;
      color: #fff8e9;
      padding: 12px 18px;
      font: 600 13px "Prompt", sans-serif;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(0,0,0,.16);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    button:hover {
      background: #2f2516;
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(0,0,0,.2);
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="icon">◉</div>
      <h1>ยืนยันบัตร RFID</h1>
      <p>โปรดนำบัตรไปแตะที่ตู้ RFID<br>ระบบจะยืนยันบัญชีของคุณโดยอัตโนมัติ</p>
      <div class="waiting"><i class="pulse"></i><span id="status">กำลังรอการแตะบัตร…</span></div>
    <div class="timer">เหลือเวลา <strong id="countdown">60</strong> วินาที</div>
    <button id="cancel">กลับไปหน้าเข้าสู่ระบบ</button>
    </section>
  </main>
  <script>
    const token = localStorage.getItem('lockerToken');
    const countdownEl = document.getElementById('countdown');
    const statusEl = document.getElementById('status');
    let timeoutId;
    let tickTimeout;
    let lastRemaining = null;

    if (!token) location.replace('/');

    function renderCountdown(expiresAt) {
      const remaining = Math.max(0, Math.floor((expiresAt - Date.now()) / 1000));
      if (remaining !== lastRemaining) {
        countdownEl.textContent = remaining;
        countdownEl.classList.add('tick');
        clearTimeout(tickTimeout);
        tickTimeout = setTimeout(() => countdownEl.classList.remove('tick'), 180);
        lastRemaining = remaining;
      }

      if (remaining <= 0) {
        statusEl.textContent = 'หมดเวลายืนยันตัวตน กรุณาลงทะเบียนใหม่';
        clearInterval(timeoutId);
        return false;
      }
      return true;
    }

    async function check() {
      try {
        const r = await fetch('/api/me', { headers: { Authorization: `Bearer ${token}` } });
        const d = await r.json();
        if (!r.ok) throw Error(d.message);

        const expiresAt = d.profile.rfidExpiresAt || Number(localStorage.getItem('rfidExpiresAt'));
        if (expiresAt && !renderCountdown(expiresAt)) return;

        if (d.profile.rfidStatus === 'verified') {
          statusEl.textContent = 'ยืนยันบัตรสำเร็จ กำลังเข้าสู่ระบบ…';
          clearInterval(timeoutId);
          setTimeout(() => location.replace('/dashboard.html'), 700);
        }
      } catch (e) {
        statusEl.textContent = e.message || 'เกิดข้อผิดพลาด';
      }
    }

    check();
    const countdownInterval = 250;
    timeoutId = setInterval(check, countdownInterval);
    cancel.onclick = () => {
      clearInterval(timeoutId);
      clearTimeout(tickTimeout);
      localStorage.removeItem('lockerToken');
      localStorage.removeItem('rfidExpiresAt');
      location.href = '/';
    };
  </script>
</body>

</html>
