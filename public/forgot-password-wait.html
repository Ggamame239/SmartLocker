<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>รอการแตะบัตร | Smart Locker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood: #4e321e;
      --cream: #fff7e6;
      --sand: #ddcdbd;
      --purple: #8737db;
      --ink: #3c2e1d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Prompt", sans-serif;
      background: #f6eedb;
      color: var(--ink);
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .04) 0 8px, rgba(0, 0, 0, .05) 8px 14px), var(--wood);
    }

    .card {
      width: min(100%, 450px);
      padding: 36px 28px 30px;
      background: var(--cream);
      border: 2px solid var(--purple);
      border-radius: 25px;
      box-shadow: 0 16px 35px #1e100980;
      text-align: center;
    }

    .icon {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #f0dfbd;
      color: #79511e;
      font-size: 38px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 30px;
      font-weight: 700;
    }

    p {
      margin: 0;
      color: #5f4c3e;
      line-height: 1.7;
      font-size: 14px;
    }

    .timer {
      margin: 22px 0 0;
      font-size: 20px;
      font-weight: 700;
      color: #2d5f3f;
    }

    .status {
      margin-top: 24px;
      padding: 16px;
      border-radius: 16px;
      background: #fff4f0;
      color: #87342f;
      font-size: 14px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      width: 100%;
      padding: 14px 0;
      border-radius: 99px;
      background: #3c301c;
      color: #fff8e9;
      font: 700 15px "Prompt", sans-serif;
      text-decoration: none;
      box-shadow: 0 14px 28px rgba(60, 48, 28, .18);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .button:hover {
      background: #2f2516;
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(60, 48, 28, .22);
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="icon">⌛</div>
      <h1>แตะบัตรภายใน 60 วินาที</h1>
      <p>ระบบกำลังรอให้คุณเอาบัตรไปแตะที่ตู้ RFID เพื่อยืนยันอีเมลของคุณ</p>
      <div class="timer"><span id="countdown">60</span> วินาที</div>
      <div class="status" id="status">หากครบเวลาแล้วจะสามารถไปเปลี่ยนรหัสผ่านได้ทันที</div>
      <a href="/" class="button">กลับไปหน้าเข้าสู่ระบบ</a>
    </section>
  </main>
  <script>
    // รับ requestId ที่ส่งมากับ query string
    const params = new URLSearchParams(window.location.search);
    const requestId = params.get('requestId');
    const countdownEl = document.getElementById('countdown');
    const statusEl = document.getElementById('status');

    if (!requestId) {
      // ถ้าไม่มี requestId ให้กลับไปหน้าลืมรหัสผ่าน
      location.href = '/forgot-password.html';
    }

    async function updateStatus() {
      try {
        // ขอสถานะคำขอรีเซ็ตจาก backend
        const response = await fetch(`/api/forgot-password/status?requestId=${encodeURIComponent(requestId)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'เกิดข้อผิดพลาด');

        countdownEl.textContent = Math.max(0, data.remaining);
        if (data.verified) {
          // ถ้า RFID ยืนยันแล้ว ให้ไปหน้าตั้งรหัสผ่าน
          statusEl.textContent = 'แตะบัตรเรียบร้อยแล้ว สามารถเปลี่ยนรหัสผ่านได้ทันที';
          setTimeout(() => location.href = `/reset-password.html?requestId=${encodeURIComponent(requestId)}`, 500);
          return;
        }
        if (data.canReset) {
          // ถ้าหมดเวลาแล้ว แม้ไม่ยืนยัน RFID ก็ไปหน้าตั้งรหัสผ่านได้
          statusEl.textContent = 'เวลาหมดแล้ว สามารถไปเปลี่ยนรหัสผ่านได้ทันที';
          setTimeout(() => location.href = `/reset-password.html?requestId=${encodeURIComponent(requestId)}`, 900);
          return;
        }
        statusEl.textContent = 'รอการแตะบัตร หากสำเร็จจะพาไปหน้าเปลี่ยนรหัสผ่านโดยอัตโนมัติ';
      } catch (error) {
        statusEl.textContent = error.message;
      }
    }

    updateStatus();
    setInterval(updateStatus, 1500);
  </script>
</body>

</html>
